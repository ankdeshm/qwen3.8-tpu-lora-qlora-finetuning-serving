apiVersion: v1
kind: Service
metadata:
  name: lora-ft-dev-svc
  namespace: default
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    job-name: lora-ft-dev
---
# Dev harness: 4 sleeping pods (one per v5p host of tpu-v5p-16-pool, 2x2x4 = 16 chips).
# Training commands are exec'd into all 4 pods simultaneously (torchrun static rendezvous on pod 0).
apiVersion: batch/v1
kind: Job
metadata:
  name: lora-ft-dev
  namespace: default
  labels:
    app: lora-ft-dev
spec:
  completions: 4
  parallelism: 4
  completionMode: Indexed
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: lora-ft-dev
      annotations:
        gke-gcsfuse/volumes: "true"
        gke-gcsfuse/cpu-limit: "0"
        gke-gcsfuse/memory-limit: "0"
        gke-gcsfuse/ephemeral-storage-limit: "0"
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: default
      subdomain: lora-ft-dev-svc
      terminationGracePeriodSeconds: 5
      restartPolicy: OnFailure
      nodeSelector:
        cloud.google.com/gke-nodepool: tpu-v5p-16-pool
        cloud.google.com/gke-tpu-accelerator: tpu-v5p-slice
        cloud.google.com/gke-tpu-topology: 2x2x4
      tolerations:
      - {key: "google.com/tpu", operator: "Exists", effect: "NoSchedule"}
      - {key: "cloud.google.com/gke-spot", operator: "Exists", effect: "NoSchedule"}
      containers:
      - name: trainer
        image: us-central1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/torchtpu/torchtitan-flint:v0.2.0
        imagePullPolicy: IfNotPresent
        command: ["bash", "-c", "sleep infinity"]
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef: {name: hf-token, key: HF_TOKEN}
        - {name: PJRT_DEVICE, value: "TPU"}
        resources:
          requests: {google.com/tpu: "4", cpu: "64", memory: 300Gi}
          limits: {google.com/tpu: "4"}
        volumeMounts:
        - {name: models-gcs, mountPath: /models}
        - {name: dshm, mountPath: /dev/shm}
      volumes:
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 200Gi}
      - name: models-gcs
        persistentVolumeClaim:
          claimName: tpu-models-gcs-pvc
